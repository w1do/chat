# Семейный чат — развёртывание одной командой:
#
#   docker compose up -d --build
#
# В Dokploy: тип Compose, этот файл, домен → сервис `web`, порт 8080.
# TLS и маршрутизацию делает внешний балансировщик (Traefik у Dokploy);
# порты наружу этот файл не публикует, чтобы не спорить с ним за 80/443.
#
# Без панели, на голом VPS:
#   docker compose -f docker-compose.yml -f docker-compose.standalone.yml up -d --build
#
# Для production обязательно задайте свои DB_PASSWORD, REDIS_PASSWORD,
# REVERB_APP_SECRET и TYPESENSE_API_KEY в .env — см. .env.example.
#
# Имя проекта здесь не задаётся намеренно: панель называет его сама, и
# фиксированное имя расходилось бы с именами контейнеров, по которым она
# строит маршруты.

x-api-env: &api-env
    APP_NAME: ${APP_NAME:-Семейный чат}
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:-http://localhost}
    # APP_KEY можно не задавать: установка сгенерирует его при первом запуске.
    APP_KEY: ${APP_KEY:-}
    OCTANE_SERVER: frankenphp
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_DATABASE: ${DB_DATABASE:-chat}
    DB_USERNAME: ${DB_USERNAME:-chat}
    DB_PASSWORD: ${DB_PASSWORD:-chat}
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:-chat}
    # Пусто = выбрать автоматически: phpredis, если расширение собралось,
    # иначе predis. Можно задать явно.
    REDIS_CLIENT: ${REDIS_CLIENT:-}
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    BROADCAST_CONNECTION: reverb
    # Один origin: SPA, API и WebSocket приходят через proxy. Авторизация —
    # bearer-токен (ADR-012), cookie-сессии в схеме нет.
    CORS_ALLOWED_ORIGINS: ${APP_URL:-http://localhost}
    TRUSTED_PROXIES: "*"
    REVERB_APP_ID: ${REVERB_APP_ID:-1001}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-chatkey}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-chatsecret}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: reverb
    REVERB_SERVER_PORT: 8080
    REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-*}
    PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-1}
    AUTH_LOGIN_PER_MINUTE: ${AUTH_LOGIN_PER_MINUTE:-5}
    AUTH_REGISTER_PER_MINUTE: ${AUTH_REGISTER_PER_MINUTE:-10}
    AUTH_PASSWORD_RESET_PER_MINUTE: ${AUTH_PASSWORD_RESET_PER_MINUTE:-5}
    PRESENCE_ONLINE_WINDOW_SECONDS: ${PRESENCE_ONLINE_WINDOW_SECONDS:-120}
    PRESENCE_TOUCH_THROTTLE_SECONDS: ${PRESENCE_TOUCH_THROTTLE_SECONDS:-60}
    # Вложения: до какого размера файла (КБ) миниатюра готовится синхронно.
    ATTACHMENT_PREVIEW_SYNC_MAX_KB: ${ATTACHMENT_PREVIEW_SYNC_MAX_KB:-4096}
    SEARCH_ENABLED: ${SEARCH_ENABLED:-true}
    TYPESENSE_HOST: typesense
    TYPESENSE_PORT: 8108
    TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-chat-typesense-key}
    AI_ENABLED: ${AI_ENABLED:-false}
    # Web Push: пусто — уведомления на устройства выключены.
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    AI_PROVIDER: ${AI_PROVIDER:-polza}
    AI_BASE_URL: ${AI_BASE_URL:-https://polza.ai/api/v1}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_MODEL: ${AI_MODEL:-openai/gpt-4o-mini}
    # Пересказ приложенного документа по ответу с «@ai».
    AI_SUMMARY_MAX_FILE_KB: ${AI_SUMMARY_MAX_FILE_KB:-5120}
    AI_SUMMARY_MIN_LENGTH: ${AI_SUMMARY_MIN_LENGTH:-500}
    AI_SUMMARY_MAX_LENGTH: ${AI_SUMMARY_MAX_LENGTH:-800}
    AI_SUMMARY_TIMEOUT_SECONDS: ${AI_SUMMARY_TIMEOUT_SECONDS:-40}
    AI_SUMMARY_PER_USER_HOURLY: ${AI_SUMMARY_PER_USER_HOURLY:-20}
    AI_SUMMARY_PER_INSTALL_HOURLY: ${AI_SUMMARY_PER_INSTALL_HOURLY:-200}
    AI_SUMMARY_QUEUE: ${AI_SUMMARY_QUEUE:-ai}
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-chat@example.com}
    MAIL_FROM_NAME: ${APP_NAME:-Семейный чат}
    # Объектное хранилище: здесь живут файлы (аватарки, вложения). Для
    # внешнего S3 задайте свой S3_ENDPOINT — встроенный minio простаивает.
    S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-chat}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-chat-secret}
    S3_BUCKET: ${S3_BUCKET:-chat}
    S3_REGION: ${S3_REGION:-us-east-1}

x-api: &api
  build:
    context: .
    dockerfile: infra/docker/api/Dockerfile
  image: ${CHAT_API_IMAGE:-chat-api:local}
  restart: unless-stopped
  environment: *api-env
  volumes:
    - api-storage:/app/storage/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  networks: [chat]

services:
  # Единственный сервис, который смотрит наружу: отдаёт SPA и проксирует
  # API и WebSocket на api и reverb. Домен направляйте сюда, порт 8080.
  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
    image: ${CHAT_WEB_IMAGE:-chat-web:local}
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Семейный чат}
      API_BASE_URL: /api/v1
      # Пустые значения = «тот же адрес, что и страница»: домен менять не нужно.
      REVERB_HOST: ""
      REVERB_PORT: ""
      REVERB_SCHEME: ""
      REVERB_APP_KEY: ${REVERB_APP_KEY:-chatkey}
      AI_ENABLED: ${AI_ENABLED:-false}
      # Требование к паролю в интерфейсе — то же, по которому проверяет сервер.
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-1}
      # Публичный ключ уезжает в SPA через /config.json.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    depends_on: [api, reverb]
    # Вторая сеть — та, в которой живёт балансировщик панели: без неё Traefik
    # не видит контейнер и отвечает «404 not found» на ваш домен.
    networks:
      - chat
      - dokploy-network
    # Маршрут для Traefik задаётся здесь, а не только в панели: контейнер
    # состоит в нескольких сетях, и балансировщику нужно явно указать нужную,
    # иначе домен отвечает 404. Панель может добавить свои метки — они не
    # конфликтуют, оба маршрута ведут в этот же контейнер. Имя роутера `chat`
    # фиксировано (подстановка переменных в именах меток не работает): при
    # втором экземпляре на том же Traefik переименуйте его здесь.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # Два маршрута на один и тот же контейнер: по http (пока сертификата нет)
      # и по https. Панель дописывает в этот же список свои метки.
      - "traefik.http.routers.chat-http.rule=Host(`${APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.chat-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}"
      - "traefik.http.routers.chat-http.service=chat"
      - "traefik.http.routers.chat.rule=Host(`${APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.chat.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.chat.tls=true"
      - "traefik.http.routers.chat.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.chat.service=chat"
      - "traefik.http.services.chat.loadbalancer.server.port=8080"
    healthcheck:
      # 127.0.0.1, не localhost: localhost внутри контейнера — это ::1.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *api
    # Этот контейнер отвечает за первый запуск: ключ, миграции, индекс поиска.
    environment:
      <<: *api-env
      APP_BOOTSTRAP: "true"
      AUTO_MIGRATE: "true"
    command: ["php", "artisan", "octane:start", "--server=frankenphp", "--host=0.0.0.0", "--port=8000", "--max-requests=${OCTANE_MAX_REQUESTS:-500}"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    <<: *api
    command: ["php", "artisan", "horizon"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 60s
      timeout: 5s
      retries: 3

  reverb:
    <<: *api
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-chat}
      POSTGRES_USER: ${DB_USERNAME:-chat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chat}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [chat]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-chat}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-chat}
    volumes:
      - redis-data:/data
    networks: [chat]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Объектное хранилище файлов. MINIO_ROOT_* и есть ключи доступа S3.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-chat}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-chat-secret}
    volumes:
      - minio-data:/data
    networks: [chat]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3

  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-chat-typesense-key}", "--enable-cors=false"]
    volumes:
      - typesense-data:/data
    networks: [chat]
    healthcheck:
      # В образе нет curl/wget, а /dev/tcp понимает только bash — не sh.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8108 && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"ok\":true' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  chat:
  # Сеть балансировщика панели: она создана заранее. На сервере без панели
  # её создаёт docker-compose.standalone.yml.
  dokploy-network:
    external: true

volumes:
  api-storage:
  postgres-data:
  redis-data:
  typesense-data:
  minio-data:
