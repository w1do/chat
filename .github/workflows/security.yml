name: security

on:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', coverage: none }
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: pnpm }
      - run: composer install --no-interaction --working-dir=apps/chat-api
      - name: Composer audit
        run: composer audit --working-dir=apps/chat-api --abandoned=report
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    name: Container scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/chat build images
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vendor/chat-api:0.1.0
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vendor/chat-web:0.1.0
          format: sarif
          output: trivy-web.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: '.' }
