name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  images:
    name: Build, sign and publish images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Версия установки — конкретный тег: плавающий latest запрещён (§14).
      - name: Build and push api
        uses: docker/build-push-action@v6
        id: api
        with:
          context: .
          file: infra/docker/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/chat-api:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Build and push web
        uses: docker/build-push-action@v6
        id: web
        with:
          context: .
          file: infra/docker/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/chat-web:${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3
      - name: Sign images (keyless)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/chat-api@${{ steps.api.outputs.digest }}
          cosign sign --yes ghcr.io/${{ github.repository }}/chat-web@${{ steps.web.outputs.digest }}

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/chat-api:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom-chat-api.cdx.json

      - name: Compose bundle and checksums
        run: |
          mkdir -p dist/compose
          cp infra/compose/compose.prod.yaml infra/compose/.env.example dist/compose/
          cp -r infra/supervisor dist/compose/supervisor
          cp docs/operations/installation.md docs/operations/upgrade.md dist/compose/
          tar -czf chat-compose-${{ github.ref_name }}.tar.gz -C dist compose
          sha256sum chat-compose-${{ github.ref_name }}.tar.gz sbom-chat-api.cdx.json > checksums.txt
          {
            echo "api digest: ${{ steps.api.outputs.digest }}"
            echo "web digest: ${{ steps.web.outputs.digest }}"
          } >> checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            chat-compose-${{ github.ref_name }}.tar.gz
            sbom-chat-api.cdx.json
            checksums.txt
