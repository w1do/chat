openapi: 3.1.0
info:
  title: Self-Hosted Chat API
  version: 0.1.0
  description: >-
    Публичный HTTP-контракт чата. Собирается из фрагментов backend-пакетов
    (packages/backend/*/openapi/) скриптом openapi/build.php.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Personal access token Sanctum без срока истечения, выданный
        /auth/login, /auth/register или /invites/{token}/accept (ADR-012).
  schemas:
    ApiError:
      type: object
      required: [code, message, details, trace_id]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        trace_id:
          type: [string, "null"]
  responses:
    ValidationError:
      description: Ошибка валидации входных данных.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: Требуется аутентификация.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Действие запрещено политикой доступа.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Ресурс не найден или недоступен.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Действие противоречит текущему состоянию.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Слишком много запросов; повторите позже.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Зависимость временно недоступна; основной сценарий продолжает работать.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
paths: {}
