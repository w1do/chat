<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: клавиатура уменьшает вьюпорт, а не прокручивает страницу.
         `maximum-scale`/`user-scalable` здесь намеренно нет: они запрещают не
         жест, а само увеличение, и нарушают WCAG 2.2 AA (1.4.4). Жест
         закрывают `touch-action` в стилях и подавление gesture-событий. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Семейный чат</title>
    <meta name="theme-color" content="#14131a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Чат" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
