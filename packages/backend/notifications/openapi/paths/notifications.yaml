/notifications:
  get:
    operationId: listNotifications
    tags: [notifications]
    summary: Лента уведомлений и счётчик непрочитанного
    security: [{ sanctumCookie: [] }]
    parameters:
      - name: unread
        in: query
        schema: { type: boolean }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    responses:
      '200':
        description: Лента уведомлений.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  type: array
                  items: { $ref: '#/components/schemas/Notification' }
                meta:
                  type: object
                  required: [unread]
                  properties:
                    unread: { type: integer, minimum: 0 }
      '401': { $ref: '#/components/responses/Unauthenticated' }
/notifications/read:
  post:
    operationId: markNotificationsRead
    tags: [notifications]
    summary: Отметить прочитанными (без списка — все)
    security: [{ sanctumCookie: [] }]
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              ids:
                type: array
                maxItems: 200
                items: { type: string, format: uuid }
    responses:
      '200':
        description: Сколько записей отмечено.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [marked]
                  properties:
                    marked: { type: integer, minimum: 0 }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '422': { $ref: '#/components/responses/ValidationError' }
