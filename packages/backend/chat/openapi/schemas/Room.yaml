type: object
required: [id, name, topic, visibility, created_by, archived_at, created_at, my_role, member_count, unread_count, photo_url, photo_large_url]
properties:
  id: { type: string, description: ULID комнаты. }
  name: { type: string }
  topic: { type: [string, "null"] }
  visibility: { type: string, enum: [public, private] }
  created_by: { type: string }
  archived_at: { type: [string, "null"], format: date-time }
  created_at: { type: string, format: date-time }
  my_role:
    type: [string, "null"]
    enum: [owner, admin, member, null]
    description: Роль текущего пользователя, null для не-участника.
  member_count: { type: [integer, "null"] }
  unread_count:
    type: [integer, "null"]
    description: Непрочитанные сообщения; null для комнат, где пользователь не состоит.
  photo_url:
    type: [string, "null"]
    description: >-
      Фотография комнаты в мелком размере — для списка переписок. null, когда
      фотографии нет: интерфейс рисует эмодзи из названия.
  photo_large_url:
    type: [string, "null"]
    description: Та же фотография в крупном размере — для шапки комнаты.
