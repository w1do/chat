type: object
description: >-
  Собеседник личной переписки: этого достаточно, чтобы подписать диалог и
  решить, какие действия показывать, без дополнительных запросов.
required: [id, username, name, avatar_url, is_online, last_seen_at]
properties:
  id: { type: string, description: ULID собеседника. }
  username: { type: string, description: Ник собеседника. }
  name: { type: string, description: Отображаемое имя; подпись диалога следует за ним. }
  avatar_url:
    type: [string, "null"]
    description: Аватарка собеседника в мелком размере; null — рисуется буква имени.
  is_online:
    type: boolean
    description: >-
      Активность была не давнее окна присутствия (по умолчанию 120 секунд):
      интерфейс показывает зелёный индикатор и «В сети».
  last_seen_at:
    type: [string, "null"]
    format: date-time
    description: >-
      Момент последней активности; null — человек ещё ни разу не был замечен.
      Запись троттлится, поэтому значение отстаёт не больше чем на окно записи.
