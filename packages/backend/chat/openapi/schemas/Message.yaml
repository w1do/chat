type: object
required: [id, room_id, kind, author_id, author_name, author_avatar_url, reply_to_id, body, mentions, edited_at, deleted, created_at, reactions, payload]
properties:
  id: { type: string, description: ULID сообщения. }
  room_id: { type: string }
  kind:
    type: string
    enum: [text, system]
    description: Системные записи описывают событие комнаты; их текст формулирует клиент.
  author_id: { type: string }
  author_avatar_url:
    type: [string, "null"]
    description: Аватарка автора в мелком размере; null — рисуется буква имени.
  author_name: { type: [string, "null"] }
  reply_to_id: { type: [string, "null"] }
  body:
    type: [string, "null"]
    description: null для удалённых сообщений — тело не раскрывается.
  mentions:
    type: array
    items: { type: string }
  edited_at: { type: [string, "null"], format: date-time }
  deleted: { type: boolean }
  created_at: { type: string, format: date-time }
  reactions:
    type: array
    items: { $ref: '#/components/schemas/Reaction' }
  attachments:
    type: array
    description: >-
      Вложения сообщения; пустой список у сообщения без вложений. У мягко
      удалённого сообщения поле отсутствует — его вложения не перечисляются.
    items: { $ref: '#/components/schemas/Attachment' }
  payload:
    type: [object, "null"]
    description: Данные системного события (event, actor_id); null для обычных сообщений.
    properties:
      event:
        type: string
        enum: [member.joined, member.invited, member.left, member.removed]
      actor_id: { type: string }
