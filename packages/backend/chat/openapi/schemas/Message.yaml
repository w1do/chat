type: object
required: [id, room_id, author_id, author_name, reply_to_id, body, mentions, edited_at, deleted, created_at, reactions]
properties:
  id: { type: string, description: ULID сообщения. }
  room_id: { type: string }
  author_id: { type: string }
  author_name: { type: [string, "null"] }
  reply_to_id: { type: [string, "null"] }
  body:
    type: [string, "null"]
    description: null для удалённых сообщений — тело не раскрывается.
  mentions:
    type: array
    items: { type: string }
  edited_at: { type: [string, "null"], format: date-time }
  deleted: { type: boolean }
  created_at: { type: string, format: date-time }
  reactions:
    type: array
    items: { $ref: '#/components/schemas/Reaction' }
