/direct-conversations:
  post:
    operationId: startDirectConversation
    tags: [direct-conversations]
    summary: Начало личной переписки (повтор возвращает ту же)
    description: >-
      Начинает диалог с человеком или открывает уже существующий: между одной
      парой людей переписка только одна, порядок участников не важен. Оба
      собеседника — обычные участники, владельца у диалога нет. Частота
      ограничена как у приглашений.
    security: [{ sanctumCookie: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [user_id]
            properties:
              user_id: { type: string, description: ULID собеседника. }
    responses:
      '201':
        description: Переписка создана.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/Room' }
      '200':
        description: Переписка уже существовала — возвращена прежняя.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/Room' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '422': { $ref: '#/components/responses/ValidationError' }
      '429':
        description: Слишком часто; действует лимит приглашений.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }
/direct-conversation-candidates:
  get:
    operationId: searchDirectConversationCandidates
    tags: [direct-conversations]
    summary: С кем можно начать переписку (поиск по нику)
    description: >-
      Тот же поиск по началу ника, что и у приглашений, с теми же правилами и
      частотой; сам ищущий в выдачу не попадает. Отметка already_member здесь
      всегда false — комнаты нет.
    security: [{ sanctumCookie: [] }]
    parameters:
      - name: query
        in: query
        schema: { type: string, maxLength: 64 }
    responses:
      '200':
        description: Подходящие люди; не больше десяти.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items: { $ref: '#/components/schemas/MemberCandidate' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '429':
        description: Слишком часто; действует лимит приглашений.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }
/direct-conversations/{room}/hide:
  parameters:
    - name: room
      in: path
      required: true
      schema: { type: string }
  post:
    operationId: hideDirectConversation
    tags: [direct-conversations]
    summary: Скрыть диалог у себя
    description: >-
      Убирает диалог из списка только у скрывшего: переписка и собеседник не
      затрагиваются, история сохраняется целиком, новое сообщение возвращает
      диалог в список. Комнату скрыть нельзя — из неё выходят. Постороннему
      отвечаем 404: существование чужого диалога не показываем.
    security: [{ sanctumCookie: [] }]
    responses:
      '204': { description: Диалог скрыт из списка скрывшего. }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404':
        description: Диалог не найден.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }
