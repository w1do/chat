/rooms/{room}/messages:
  parameters:
    - name: room
      in: path
      required: true
      schema: { type: string }
  get:
    operationId: listMessages
    tags: [messages]
    summary: История сообщений комнаты (cursor-пагинация, новые → старые)
    security: [{ sanctumCookie: [] }]
    parameters:
      - name: cursor
        in: query
        schema: { type: string }
        description: ULID последнего сообщения предыдущей страницы.
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    responses:
      '200':
        description: Страница истории.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  type: array
                  items: { $ref: '#/components/schemas/Message' }
                meta:
                  type: object
                  required: [next_cursor]
                  properties:
                    next_cursor: { type: [string, "null"] }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden' }
  post:
    operationId: sendMessage
    tags: [messages]
    summary: Отправка сообщения (идемпотентна по Idempotency-Key)
    security: [{ sanctumCookie: [] }]
    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [body]
            properties:
              body: { type: string, maxLength: 4000 }
              reply_to_id: { type: [string, "null"] }
              mentions:
                type: array
                maxItems: 20
                items: { type: string }
    responses:
      '201':
        description: Сообщение создано.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/Message' }
      '200':
        description: Повтор с тем же Idempotency-Key — возвращается ранее созданное сообщение.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/Message' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationError' }
