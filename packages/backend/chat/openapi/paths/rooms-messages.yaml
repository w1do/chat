/rooms/{room}/messages:
  parameters:
    - name: room
      in: path
      required: true
      schema: { type: string }
  get:
    operationId: listMessages
    tags: [messages]
    summary: История сообщений комнаты (cursor-пагинация, новые → старые)
    security: [{ sanctumCookie: [] }]
    parameters:
      - name: cursor
        in: query
        schema: { type: string }
        description: ULID последнего сообщения предыдущей страницы.
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    responses:
      '200':
        description: Страница истории.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  type: array
                  items: { $ref: '#/components/schemas/Message' }
                meta:
                  type: object
                  required: [next_cursor]
                  properties:
                    next_cursor: { type: [string, "null"] }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden' }
  post:
    operationId: sendMessage
    tags: [messages]
    summary: Отправка сообщения (идемпотентна по Idempotency-Key)
    security: [{ sanctumCookie: [] }]
    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: >-
              Сообщение полно, когда есть непустой текст или хотя бы одно
              вложение; форма без того и другого отклоняется (422).
            properties:
              body: { type: [string, "null"], maxLength: 4000 }
              reply_to_id: { type: [string, "null"] }
              mentions:
                type: array
                maxItems: 20
                items: { type: string }
              attachments:
                type: array
                description: >-
                  UUID загруженных вложений этого же автора и этой же комнаты;
                  предел количества задаётся установкой (по умолчанию 10).
                items: { type: string }
    responses:
      '201':
        description: Сообщение создано.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/Message' }
      '200':
        description: Повтор с тем же Idempotency-Key — возвращается ранее созданное сообщение.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/Message' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationError' }
/rooms/{room}/read:
  parameters:
    - name: room
      in: path
      required: true
      schema: { type: string }
  post:
    operationId: markRoomRead
    tags: [messages]
    summary: Отметка прочтения (не двигается назад)
    security: [{ sanctumCookie: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [last_read_message_id]
            properties:
              last_read_message_id: { type: string }
    responses:
      '204': { description: Отметка обновлена. }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationError' }
/rooms/{room}/typing:
  parameters:
    - name: room
      in: path
      required: true
      schema: { type: string }
  post:
    operationId: setTyping
    tags: [messages]
    summary: Сигнал набора текста (транслируется в presence-канал)
    security: [{ sanctumCookie: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [is_typing]
            properties:
              is_typing: { type: boolean }
    responses:
      '204': { description: Сигнал принят. }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationError' }
