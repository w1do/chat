/rooms/{room}/attachments:
  parameters:
    - name: room
      in: path
      required: true
      schema: { type: string }
  post:
    operationId: uploadAttachment
    tags: [messages]
    summary: Загрузка вложения до отправки сообщения
    description: >-
      Файл загружается отдельным запросом; сообщение затем отправляется со
      списком идентификаторов. Право — то же, что на отправку сообщения.
      Принимаются только типы из белого списка установки; исполняемые файлы
      отклоняются. Не отправленное вложение убирается по расписанию.
    security: [{ sanctumCookie: [] }]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }
    responses:
      '201':
        description: Файл принят и лежит в объектном хранилище.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/Attachment' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404':
        description: Приватная комната не показана постороннему.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }
      '422': { $ref: '#/components/responses/ValidationError' }
      '429': { $ref: '#/components/responses/RateLimited' }
/attachments/{attachment}:
  parameters:
    - name: attachment
      in: path
      required: true
      schema: { type: string }
  get:
    operationId: downloadAttachment
    tags: [messages]
    summary: Файл вложения (отдаётся на скачивание)
    description: >-
      Доступен тем, кто вправе читать сообщение. Ответ уходит с заголовком
      «Content-Disposition: attachment» — браузер не исполняет содержимое.
      Вложения удалённого сообщения не отдаются.
    security: [{ sanctumCookie: [] }]
    responses:
      '200':
        description: Содержимое файла.
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound' }
/attachments/{attachment}/thumb:
  parameters:
    - name: attachment
      in: path
      required: true
      schema: { type: string }
  get:
    operationId: showAttachmentThumb
    tags: [messages]
    summary: Миниатюра изображения-вложения (webp)
    description: Есть только у изображений и только когда конверсия готова.
    security: [{ sanctumCookie: [] }]
    responses:
      '200':
        description: Миниатюра.
        content:
          image/webp:
            schema: { type: string, format: binary }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound' }
