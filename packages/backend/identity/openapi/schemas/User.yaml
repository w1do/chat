type: object
required: [id, login, name, email, locale, timezone, email_verified_at, created_at, avatar_url, avatar_large_url, wallpaper_url, is_online, last_seen_at]
properties:
  id:
    type: string
    description: ULID пользователя.
  login:
    type: string
    description: Уникальный логин — идентификатор входа.
  name:
    type: string
  email:
    type: [string, "null"]
    format: email
    description: Необязательна; задаётся в настройках.
  locale:
    type: string
    example: ru
  timezone:
    type: string
    example: Europe/Moscow
  email_verified_at:
    type: [string, "null"]
    format: date-time
  created_at:
    type: string
    format: date-time
  avatar_url:
    type: [string, "null"]
    description: >-
      Текущая аватарка в мелком размере — для списков и лент. null, когда
      аватарки нет: интерфейс рисует букву имени.
  avatar_large_url:
    type: [string, "null"]
    description: Та же аватарка в крупном размере — для экрана профиля.
  wallpaper_url:
    type: [string, "null"]
    description: Личные обои переписки; видны только своему владельцу.
  is_online:
    type: boolean
    description: >-
      Активность была не давнее окна присутствия (по умолчанию 120 секунд):
      интерфейс показывает зелёный индикатор и «В сети».
  last_seen_at:
    type: [string, "null"]
    format: date-time
    description: >-
      Момент последней активности; null — человек ещё ни разу не был замечен.
      Запись троттлится, поэтому значение отстаёт не больше чем на окно записи.
