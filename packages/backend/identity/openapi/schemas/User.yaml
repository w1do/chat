type: object
required: [id, name, email, locale, timezone, email_verified_at, created_at]
properties:
  id:
    type: string
    description: ULID пользователя.
  name:
    type: string
  email:
    type: string
    format: email
  locale:
    type: string
    example: ru
  timezone:
    type: string
    example: Europe/Moscow
  email_verified_at:
    type: [string, "null"]
    format: date-time
  created_at:
    type: string
    format: date-time
