type: object
required: [id, login, name, email, locale, timezone, email_verified_at, created_at]
properties:
  id:
    type: string
    description: ULID пользователя.
  login:
    type: string
    description: Уникальный логин — идентификатор входа.
  name:
    type: string
  email:
    type: [string, "null"]
    format: email
    description: Необязательна; задаётся в настройках.
  locale:
    type: string
    example: ru
  timezone:
    type: string
    example: Europe/Moscow
  email_verified_at:
    type: [string, "null"]
    format: date-time
  created_at:
    type: string
    format: date-time
