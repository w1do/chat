/auth/register:
  post:
    operationId: register
    tags: [auth]
    summary: Регистрация по логину (почта не требуется)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [login, password]
            properties:
              login:
                type: string
                minLength: 3
                maxLength: 64
                pattern: '^[a-zA-Z0-9._-]+$'
              password: { type: string, minLength: 10 }
              name:
                type: string
                maxLength: 255
                description: Отображаемое имя; по умолчанию совпадает с логином.
    responses:
      '201':
        description: Пользователь создан; в ответе — он сам и его токен доступа.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatedUser'
      '422':
        $ref: '#/components/responses/ValidationError'
      '429':
        description: Превышен rate limit.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
/auth/login:
  post:
    operationId: login
    tags: [auth]
    summary: Вход по логину; ответ несёт токен доступа (ADR-012)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [login, password]
            properties:
              login: { type: string, maxLength: 64 }
              password: { type: string }
    responses:
      '200':
        description: >-
          Аутентифицирован; в ответе новый бессрочный токен доступа. Cookie
          аутентификации не выдаётся.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatedUser'
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '422':
        $ref: '#/components/responses/ValidationError'
      '429':
        description: Превышен rate limit.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
/auth/logout:
  post:
    operationId: logout
    tags: [auth]
    summary: Выход — отзывает токен текущего устройства
    security:
      - bearerAuth: []
    responses:
      '204':
        description: >-
          Токен, которым выполнен запрос, отозван. Токены других устройств
          продолжают действовать.
      '401':
        $ref: '#/components/responses/Unauthenticated'
/auth/forgot-password:
  post:
    operationId: forgotPassword
    tags: [auth]
    summary: Запрос ссылки восстановления пароля (работает только при заданной почте)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
    responses:
      '202':
        description: Ответ одинаков для существующего и несуществующего email.
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      '422':
        $ref: '#/components/responses/ValidationError'
      '429':
        description: Превышен rate limit.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
/auth/reset-password:
  post:
    operationId: resetPassword
    tags: [auth]
    summary: Установка нового пароля по токену (отзывает все токены доступа)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, token, password]
            properties:
              email: { type: string, format: email }
              token: { type: string }
              password: { type: string, minLength: 10 }
    responses:
      '204':
        description: Пароль обновлён; все прежде выданные токены доступа отозваны.
      '422':
        $ref: '#/components/responses/ValidationError'
      '429':
        description: Превышен rate limit.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
