[program:chat-scheduler]
command=php /var/www/chat/apps/chat-api/artisan schedule:work
directory=/var/www/chat/apps/chat-api
user=chat
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/chat/scheduler.log
stderr_logfile=/var/log/chat/scheduler.error.log
