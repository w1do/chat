[program:chat-horizon]
command=php /var/www/chat/apps/chat-api/artisan horizon
directory=/var/www/chat/apps/chat-api
user=chat
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
; Должно превышать длительность самой долгой job (CLAUDE.md §14).
; Самая долгая ожидаемая job — email/digest, timeout 60s → 120s c запасом.
stopwaitsecs=120
stdout_logfile=/var/log/chat/horizon.log
stderr_logfile=/var/log/chat/horizon.error.log
