; Supervisor для Linux/VM-профиля self-hosted установки (без Docker).
; Приложение развёрнуто в /var/www/chat/apps/chat-api, процессы — от
; непривилегированного пользователя chat.
; Запуск: supervisord -c /etc/supervisor/supervisord.conf

[supervisord]
logfile=/var/log/chat/supervisord.log
pidfile=/run/chat-supervisord.pid
user=root

[unix_http_server]
file=/run/chat-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/chat-supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
