[program:chat-octane]
command=php /var/www/chat/apps/chat-api/artisan octane:start --server=frankenphp --host=127.0.0.1 --port=8000 --max-requests=500
directory=/var/www/chat/apps/chat-api
user=chat
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/chat/octane.log
stderr_logfile=/var/log/chat/octane.error.log
