[program:chat-reverb]
command=php /var/www/chat/apps/chat-api/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/chat/apps/chat-api
user=chat
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/chat/reverb.log
stderr_logfile=/var/log/chat/reverb.error.log
