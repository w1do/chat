# SPA и обратный прокси в одном контейнере: приложение, API и WebSocket должны
# отвечать с одного origin — этого требует cookie-аутентификация Sanctum.
# Внешний балансировщик (Traefik у Dokploy, любой другой прокси) направляет
# домен сюда, на порт 8080, и терминирует TLS.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # DNS Docker: адреса api и reverb резолвятся во время работы, поэтому
    # контейнер поднимается, даже если они ещё не готовы.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # --- HTTP API -----------------------------------------------------------
    location ~ ^/(api|up|broadcasting|sanctum)(/|$) {
        set $api_upstream "http://api:8000";
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # --- WebSocket (Reverb) -------------------------------------------------
    location ~ ^/(app|apps)(/|$) {
        set $ws_upstream "http://reverb:8080";
        proxy_pass $ws_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Соединение живёт долго: обрыв по таймауту прокси недопустим.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Статика SPA --------------------------------------------------------
    # Runtime-конфигурация рендерится entrypoint'ом при старте контейнера.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
