# Dev-профиль: только инфраструктурные зависимости.
# API (octane/horizon/reverb) и SPA запускаются локально из исходников.
# Запуск: docker compose -f compose.dev.yaml up -d
name: chat-dev

services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-chat}
      POSTGRES_USER: ${DB_USERNAME:-chat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chat}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-dev-typesense-key}"]
    ports:
      - "${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - typesense-dev-data:/data
    healthcheck:
      # В образе нет curl/wget, а /dev/tcp понимает только bash — не sh.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8108 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"ok\":true' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3

  mailpit:
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    profiles: [s3]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-dev-secret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-dev-data:/data

volumes:
  postgres-dev-data:
  redis-dev-data:
  typesense-dev-data:
  minio-dev-data:
